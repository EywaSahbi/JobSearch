<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs · Raum Dortmund</title>
<style>
:root {
  --bg: #f5f4ef;
  --panel: #ffffff;
  --line: #e3e1d8;
  --text: #1d1c19;
  --muted: #6a675f;
  --accent: #0f766e;
  --accent-soft: #dcefec;
  --on-accent: #ffffff;
  --star: #b7791f;
  --ok: #2e7d32;
  --hover: #f0eee7;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131412;
    --panel: #1b1c19;
    --line: #2d2f2a;
    --text: #eceae4;
    --muted: #9b998f;
    --accent: #4fd1c5;
    --accent-soft: #16322f;
    --on-accent: #0b1f1d;
    --star: #f0b755;
    --ok: #7bc67f;
    --hover: #232521;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template: auto minmax(0, 1fr) / 236px minmax(320px, 430px) minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- Kopfzeile ---- */
header {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#q, #sort, .ghost {
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  padding: 0 10px;
}
#q { width: min(380px, 100%); flex: 1 1 220px; max-width: 420px; }
#filter-toggle { display: none; }
#scrape:disabled { opacity: 0.55; cursor: default; }
#progress { flex: 1 0 100%; display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--muted); font-size: 12.5px; }
#progress[hidden], #pdone[hidden] { display: none; }
#ptext { flex: 0 1 340px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { flex: 1 1 120px; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.6s ease; }
#ppct { min-width: 4ch; text-align: right; }
#pdone { height: 28px; }
#progress.note #ptext { flex: 1; white-space: normal; color: var(--text); }
#progress.note .bar, #progress.note #ppct { display: none; }

/* ---- Filterleiste ---- */
aside {
  overflow-y: auto;
  padding: 12px 10px 20px;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
aside h2 {
  margin: 18px 8px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
}
aside h2:first-child { margin-top: 2px; }
.tab, .opt {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 8px;
  border: 0;
  border-radius: 7px;
  background: none;
  text-align: left;
}
.tab:hover, .opt:hover { background: var(--hover); }
.tab[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.opt { cursor: pointer; }
.opt input { margin: 0; accent-color: var(--accent); }
.opt span:first-of-type, .tab span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.scroll { max-height: 262px; overflow-y: auto; }
.seg { display: flex; margin: 0 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 5px 0; border: 0; background: none; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
#reset { margin: 16px 8px 0; }
.keys { margin: 22px 8px 0; color: var(--muted); font-size: 12px; line-height: 1.9; }
kbd {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  font: 11px ui-monospace, Consolas, monospace;
}

/* ---- Liste ---- */
#list-pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#count { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 37px; padding: 4px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
#send-all { height: 28px; font-size: 12.5px; }
#list { flex: 1; margin: 0; padding: 0; overflow-y: auto; list-style: none; }
.item {
  display: block;
  width: 100%;
  padding: 10px 14px 10px 22px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  position: relative;
}
.item:hover { background: var(--hover); }
.item.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item.unseen::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 16px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.item-title { display: block; overflow-wrap: anywhere; }
.item.unseen .item-title { font-weight: 650; }
.item-sub { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; color: var(--muted); font-size: 12px; }
.star { color: var(--star); }
.tag {
  padding: 0 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  white-space: nowrap;
}
.tag.new { border-color: transparent; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tag.done { border-color: transparent; background: var(--ok); color: var(--panel); font-weight: 600; }
.more { display: block; width: calc(100% - 28px); margin: 14px; }
.empty { padding: 48px 24px; color: var(--muted); text-align: center; }
.empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 15px; }
code { padding: 1px 5px; border-radius: 4px; background: var(--hover); font: 12.5px ui-monospace, Consolas, monospace; }

/* ---- Detail ---- */
#detail { overflow-y: auto; background: var(--panel); }
.detail-inner { max-width: 780px; padding: 26px 32px 60px; }
.back { display: none; margin-bottom: 14px; }
#detail h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
.company { margin: 0; color: var(--muted); font-size: 15px; }
.company b { color: var(--text); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.tags .tag { padding: 2px 9px; font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.btn:disabled { cursor: default; }
.desc { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.desc h4 { margin: 22px 0 6px; font-size: 15.5px; }
.desc p { margin: 0 0 12px; }
.desc ul, .desc ol { margin: 0 0 12px; padding-left: 22px; }
.desc li { margin-bottom: 3px; }
.desc a { color: var(--accent); }
.desc hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.scrim { display: none; }

@media (max-width: 1000px) {
  body { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); }
  #filter-toggle { display: inline-flex; align-items: center; }
  aside {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 20;
    width: 264px;
    transform: translateX(-100%);
    transition: transform 0.18s ease;
  }
  body.show-filters aside { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / 0.3); }
  body.show-filters .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgb(0 0 0 / 0.35); }
}
@media (max-width: 700px) {
  body { grid-template-columns: minmax(0, 1fr); }
  #list-pane { border-right: 0; }
  #detail { display: none; position: fixed; inset: 0; z-index: 30; }
  body.show-detail #detail { display: block; }
  .back { display: inline-flex; }
  .detail-inner { padding: 16px 16px 48px; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { aside, .fill { transition: none; } }
</style>
</head>
<body>
<header>
  <button id="filter-toggle" class="ghost" type="button">Filter</button>
  <div class="brand"><h1>Jobs</h1><span id="meta"></span></div>
  <input id="q" type="search" placeholder="Suche in Titel, Firma, Beschreibung …" aria-label="Suche">
  <select id="sort" aria-label="Sortierung">
    <option value="date">Neueste zuerst</option>
    <option value="company">Firma A–Z</option>
    <option value="title">Titel A–Z</option>
  </select>
  <button id="scrape" class="btn primary" type="button">Neu scrapen</button>
  <div id="progress" hidden>
    <span id="ptext" role="status"></span>
    <div id="pbar" class="bar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100"><div id="pfill" class="fill"></div></div>
    <span id="ppct" class="n"></span>
    <button id="pdone" class="btn" type="button" hidden>Jetzt anzeigen</button>
  </div>
</header>

<aside id="filters" aria-label="Filter"></aside>

<section id="list-pane" aria-label="Trefferliste">
  <div id="count"></div>
  <ul id="list"></ul>
</section>

<article id="detail" aria-live="polite"></article>
<div class="scrim"></div>

<script src="output/jobs.js"></script>
<script>
(() => {
'use strict';

const DATA = window.JOBS_DATA || { jobs: [], generated: null };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? esc(u) : '#');
const localDate = (d) => d.toLocaleDateString('sv'); // YYYY-MM-DD in Ortszeit
const TODAY = localDate(new Date());

const SITES = { indeed: 'Indeed', linkedin: 'LinkedIn', glassdoor: 'Glassdoor' };
const TYPES = { fulltime: 'Vollzeit', parttime: 'Teilzeit', internship: 'Praktikum', contract: 'Befristet', temporary: 'Zeitarbeit' };
const TABS = [['open', 'Offen'], ['new', 'Neu im letzten Lauf'], ['saved', 'Gemerkt'], ['applied', 'Beworben'], ['hidden', 'Ausgeblendet']];
const PAGE = 300;

// ---- Speicher (localStorage: bleibt nur in diesem Browser) ----
function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
}
// id -> { s: 'saved' | 'applied' | 'hidden', seen: 1, job: Kopie für gemerkte/beworbene Jobs }
const marks = read('jobs-marks-v1', {});
function saveMarks() {
  if (write('jobs-marks-v1', marks)) return;
  // Speicher voll: Kopien ohne Beschreibung behalten
  for (const m of Object.values(marks)) if (m.job) delete m.job.description;
  write('jobs-marks-v1', marks);
}
const snapshot = ({ _date, _hay, _sites, ...job }) => job;
// was schon in der Inbox von career-ops liegt, weiß nur der lokale Server
let careerOps = { ready: false, sent: new Set() };

// ---- Daten ----
const jobs = DATA.jobs.slice();
const known = new Set(jobs.map((j) => j.id));
// gemerkte/beworbene Jobs bleiben sichtbar, auch wenn der Scraper sie schon gelöscht hat
for (const [id, m] of Object.entries(marks)) {
  if (m.job && !known.has(id)) jobs.push(m.job);
}
for (const j of jobs) {
  j.terms = j.terms || [];
  j._date = j.date_posted || (j.first_seen || '').slice(0, 10);
  j._sites = Object.keys(j.links || {});
  j._hay = [j.title, j.company, j.location, j.description].join(' ').toLowerCase();
  const m = marks[j.id];
  if (m && m.job && known.has(j.id)) m.job = snapshot(j);
}
const byId = new Map(jobs.map((j) => [j.id, j]));

// ---- Filterzustand ----
const f = Object.assign(
  { tab: 'open', cities: [], terms: [], sites: [], days: 0, remote: false, sort: 'date' },
  read('jobs-filter-v1', {}),
  { q: '' },
);
if (!TABS.some(([key]) => key === f.tab)) f.tab = 'open';
let visible = [];
let selected = null;
let limit = PAGE;

const status = (j) => (marks[j.id] || {}).s;
function inTab(j, tab) {
  const s = status(j);
  if (tab === 'open') return s !== 'hidden' && s !== 'applied';
  if (tab === 'new') return s !== 'hidden' && s !== 'applied' && j.first_seen === DATA.generated;
  return s === tab;
}
function passes(j, skip, words, cutoff) {
  if (!words.every((w) => j._hay.includes(w))) return false;
  if (skip !== 'cities' && f.cities.length && !f.cities.includes(j.city)) return false;
  if (skip !== 'terms' && f.terms.length && !j.terms.some((t) => f.terms.includes(t))) return false;
  if (skip !== 'sites' && f.sites.length && !j._sites.some((s) => f.sites.includes(s))) return false;
  if (cutoff && j._date < cutoff) return false;
  if (f.remote && !j.is_remote) return false;
  return true;
}
const sorters = {
  date: (a, b) => b._date.localeCompare(a._date) || (b.first_seen || '').localeCompare(a.first_seen || '') || a.title.localeCompare(b.title, 'de'),
  company: (a, b) => a.company.localeCompare(b.company, 'de') || a.title.localeCompare(b.title, 'de'),
  title: (a, b) => a.title.localeCompare(b.title, 'de') || a.company.localeCompare(b.company, 'de'),
};

// ---- Darstellung ----
function relDate(d) {
  if (!d) return '';
  const days = Math.round((new Date(TODAY) - new Date(d)) / 864e5);
  if (days <= 0) return 'heute';
  if (days === 1) return 'gestern';
  if (days < 14) return `vor ${days} Tagen`;
  return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// Kleiner Markdown-Renderer: escaped zuerst alles, baut dann nur bekannte Tags.
function md(src) {
  const held = [];
  const inline = (s) => esc(s.replace(/\\([^a-zA-Z0-9\s])/g, (_, c) => `\u0001${held.push(c) - 1}\u0001`))
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^\s*][^*]*?)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w_])_([^\s_][^_]*?)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/\u0001(\d+)\u0001/g, (_, i) => esc(held[i]));

  const out = [];
  let para = [];
  let list = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const item = (type, text) => {
    flushPara();
    if (list !== type) { closeList(); out.push(`<${type}>`); list = type; }
    out.push(`<li>${inline(text)}</li>`);
  };
  for (const raw of String(src).split(/\r?\n/)) {
    const line = raw.trim();
    let m;
    if (!line) flushPara();
    else if ((m = line.match(/^#{1,6}\s+(.*?)\s*#*$/))) { flushPara(); closeList(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if (/^([-*_])(\s*\1){2,}$/.test(line)) { flushPara(); closeList(); out.push('<hr>'); }
    else if ((m = line.match(/^[-*+•·]\s+(.*)$/))) item('ul', m[1]);
    else if ((m = line.match(/^\d{1,2}[.)]\s+(.*)$/))) item('ol', m[1]);
    else { closeList(); para.push(inline(line)); }
  }
  flushPara();
  closeList();
  return out.join('');
}

function itemHtml(j) {
  const m = marks[j.id] || {};
  const cls = ['item', j.id === selected ? 'sel' : '', m.seen ? '' : 'unseen'].join(' ');
  const meta = [
    `<span>${esc([relDate(j._date), ...j._sites.map((s) => SITES[s] || s)].filter(Boolean).join(' · '))}</span>`,
    j.first_seen === DATA.generated && !m.seen ? '<span class="tag new">Neu</span>' : '',
    m.s === 'applied' ? '<span class="tag done">Beworben</span>' : '',
    careerOps.sent.has(j.id) ? '<span class="tag">career-ops</span>' : '',
    j.is_remote ? '<span class="tag">Remote</span>' : '',
    j.salary ? `<span class="tag">${esc(j.salary)}</span>` : '',
  ].join('');
  return `<li><button type="button" class="${cls}" data-id="${esc(j.id)}">
    <span class="item-title">${m.s === 'saved' ? '<span class="star" title="Gemerkt">★</span> ' : ''}${esc(j.title)}</span>
    <span class="item-sub">${esc(j.company || 'Firma unbekannt')}${j.city ? ' · ' + esc(j.city) : ''}</span>
    <span class="item-meta">${meta}</span>
  </button></li>`;
}

function renderList() {
  const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  const cutoff = f.days ? localDate(new Date(Date.now() - f.days * 864e5)) : '';
  visible = jobs.filter((j) => inTab(j, f.tab) && passes(j, null, words, cutoff)).sort(sorters[f.sort] || sorters.date);

  const unsent = f.tab === 'saved' ? visible.filter((j) => !careerOps.sent.has(j.id)).length : 0;
  $('#count').innerHTML = `<span>${visible.length} ${visible.length === 1 ? 'Job' : 'Jobs'}</span>`
    + (unsent ? `<button type="button" class="btn" id="send-all">Alle an career-ops senden (${unsent})</button>` : '');
  if (!DATA.generated && !jobs.length) {
    $('#list').innerHTML = '<li class="empty"><strong>Noch keine Daten</strong>Oben auf „Neu scrapen“ klicken.</li>';
  } else if (!visible.length) {
    $('#list').innerHTML = '<li class="empty"><strong>Keine Treffer</strong>Filter lockern oder einen anderen Bereich links wählen.</li>';
  } else {
    const more = visible.length > limit ? `<li><button type="button" class="btn more" id="more">Weitere ${Math.min(PAGE, visible.length - limit)} anzeigen</button></li>` : '';
    $('#list').innerHTML = visible.slice(0, limit).map(itemHtml).join('') + more;
  }
}

function facetHtml(key, title, valuesOf, label, words, cutoff) {
  const counts = new Map(f[key].map((v) => [v, 0]));
  for (const j of jobs) {
    if (!inTab(j, f.tab) || !passes(j, key, words, cutoff)) continue;
    for (const v of valuesOf(j)) counts.set(v, (counts.get(v) || 0) + 1);
  }
  const rows = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'de'));
  if (!rows.length) return '';
  return `<h2>${title}</h2><div class="scroll">${rows.map(([v, n]) => `<label class="opt">
    <input type="checkbox" data-facet="${key}" value="${esc(v)}"${f[key].includes(v) ? ' checked' : ''}>
    <span>${esc(label(v))}</span><span class="n">${n}</span></label>`).join('')}</div>`;
}

function renderFilters() {
  const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  const cutoff = f.days ? localDate(new Date(Date.now() - f.days * 864e5)) : '';
  const focused = document.activeElement && document.activeElement.closest('aside') ? document.activeElement : null;
  const focusKey = focused && [focused.dataset.facet, focused.value, focused.dataset.tab, focused.dataset.days, focused.id];

  const tabs = TABS.map(([key, name]) => {
    const n = jobs.filter((j) => inTab(j, key)).length;
    return `<button type="button" class="tab" data-tab="${key}" aria-current="${f.tab === key}"><span>${name}</span><span class="n">${n}</span></button>`;
  }).join('');
  const days = [[0, 'Alle'], [1, '24 h'], [3, '3 Tage'], [7, '7 Tage']]
    .map(([d, name]) => `<button type="button" data-days="${d}" aria-pressed="${f.days === d}">${name}</button>`).join('');
  const active = f.cities.length || f.terms.length || f.sites.length || f.days || f.remote || f.q;

  $('#filters').innerHTML = `
    <h2>Bereich</h2>${tabs}
    <h2>Veröffentlicht</h2><div class="seg">${days}</div>
    ${facetHtml('cities', 'Stadt', (j) => [j.city], (v) => v || 'Ohne Ortsangabe', words, cutoff)}
    ${facetHtml('terms', 'Suchbegriff', (j) => j.terms, (v) => v, words, cutoff)}
    ${facetHtml('sites', 'Quelle', (j) => j._sites, (v) => SITES[v] || v, words, cutoff)}
    <h2>Sonstiges</h2>
    <label class="opt"><input type="checkbox" id="remote"${f.remote ? ' checked' : ''}><span>Nur Remote</span></label>
    ${active ? '<button type="button" class="btn" id="reset">Filter zurücksetzen</button>' : ''}
    <p class="keys"><kbd>↑</kbd> <kbd>↓</kbd> blättern · <kbd>O</kbd> öffnen<br><kbd>S</kbd> merken · <kbd>B</kbd> beworben<br><kbd>X</kbd> ausblenden · <kbd>/</kbd> suchen<br><kbd>C</kbd> an career-ops senden</p>`;

  if (focusKey) {
    const again = [...document.querySelectorAll('#filters input, #filters button')]
      .find((el) => String([el.dataset.facet, el.value, el.dataset.tab, el.dataset.days, el.id]) === String(focusKey));
    if (again) again.focus();
  }
}

function renderDetail() {
  const j = byId.get(selected);
  const el = $('#detail');
  if (!j) {
    el.innerHTML = '<div class="empty"><strong>Kein Job ausgewählt</strong>Links einen Eintrag anklicken.</div>';
    return;
  }
  const s = status(j);
  const sent = careerOps.sent.has(j.id);
  const links = Object.entries(j.links || {}).map(([site, url], i) =>
    `<a class="btn${i ? '' : ' primary'}" href="${safeUrl(url)}" target="_blank" rel="noopener">${i ? '' : 'Anzeige öffnen · '}${esc(SITES[site] || site)} ↗</a>`).join('');
  const types = String(j.job_type || '').split(',').map((t) => TYPES[t.trim()] || t.trim()).filter(Boolean);
  const level = j.job_level && j.job_level !== 'not applicable' ? j.job_level : '';
  const tags = [
    relDate(j._date) && `Veröffentlicht ${relDate(j._date)}`,
    ...types,
    level,
    j.is_remote && 'Remote',
    j.salary,
    ...j.terms.map((t) => `Suche: ${t}`),
  ].filter(Boolean).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
  const toggle = (key, on, off) => `<button type="button" class="btn" data-act="${key}" aria-pressed="${s === key}">${s === key ? on : off}</button>`;

  el.innerHTML = `<div class="detail-inner">
    <button type="button" class="btn back" id="back">← Zur Liste</button>
    <h2>${esc(j.title)}</h2>
    <p class="company"><b>${esc(j.company || 'Firma unbekannt')}</b>${j.location ? ' · ' + esc(j.location) : ''}</p>
    <div class="tags">${tags}</div>
    <div class="actions">${links}
      ${toggle('saved', '★ Gemerkt', '☆ Merken')}
      ${toggle('applied', '✓ Beworben', 'Als beworben markieren')}
      ${toggle('hidden', 'Wieder einblenden', 'Ausblenden')}
      <button type="button" class="btn" data-act="send" aria-pressed="${sent}"${sent ? ' disabled' : ''}>${sent ? '✓ An career-ops gesendet' : 'An career-ops senden'}</button>
    </div>
    <div class="desc">${j.description ? md(j.description) : '<p class="empty">Für diesen Job wurde keine Beschreibung geladen. Über „Anzeige öffnen“ geht es zur Originalseite.</p>'}</div>
  </div>`;
  el.scrollTop = 0;
}

function update() {
  write('jobs-filter-v1', { ...f, q: undefined });
  renderList();
  renderFilters();
}

function select(id, byUser) {
  if (!byId.has(id)) { selected = null; renderDetail(); return; }
  selected = id;
  try { sessionStorage.setItem('jobs-selected', id); } catch {}
  const m = marks[id] || (marks[id] = {});
  if (!m.seen) { m.seen = 1; saveMarks(); }
  for (const el of document.querySelectorAll('#list .item')) {
    const hit = el.dataset.id === id;
    el.classList.toggle('sel', hit);
    if (hit) {
      el.classList.remove('unseen');
      const badge = el.querySelector('.tag.new');
      if (badge) badge.remove();
      el.scrollIntoView({ block: 'nearest' });
    }
  }
  renderDetail();
  if (byUser) document.body.classList.add('show-detail');
}

function setStatus(key) {
  const j = byId.get(selected);
  if (!j) return;
  const m = marks[j.id] || (marks[j.id] = {});
  if (m.s === key) { delete m.s; delete m.job; }
  else { m.s = key; if (key === 'hidden') delete m.job; else m.job = snapshot(j); }
  saveMarks();
  const index = visible.findIndex((v) => v.id === j.id);
  update();
  // fällt der Job aus der Liste, rückt der nächste nach
  if (visible.some((v) => v.id === j.id)) renderDetail();
  else select((visible[Math.min(index, visible.length - 1)] || {}).id, false);
}

function move(step) {
  if (!visible.length) return;
  const index = visible.findIndex((v) => v.id === selected);
  const next = Math.max(0, Math.min(visible.length - 1, index + step));
  if (next >= limit) { limit += PAGE; renderList(); }
  select(visible[next].id, true);
}

// ---- Ereignisse ----
$('#list').addEventListener('click', (e) => {
  if (e.target.closest('#more')) { limit += PAGE; renderList(); return; }
  const el = e.target.closest('.item');
  if (el) select(el.dataset.id, true);
});
$('#detail').addEventListener('click', (e) => {
  if (e.target.closest('#back')) { document.body.classList.remove('show-detail'); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'send') sendSelected();
  else setStatus(act.dataset.act);
});
$('#count').addEventListener('click', (e) => {
  if (e.target.closest('#send-all')) sendJobs(visible.filter((j) => !careerOps.sent.has(j.id)));
});
$('#filters').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  const days = e.target.closest('[data-days]');
  if (tab) f.tab = tab.dataset.tab;
  else if (days) f.days = Number(days.dataset.days);
  else if (e.target.closest('#reset')) {
    Object.assign(f, { cities: [], terms: [], sites: [], days: 0, remote: false, q: '' });
    $('#q').value = '';
  } else return;
  limit = PAGE;
  update();
});
$('#filters').addEventListener('change', (e) => {
  const box = e.target;
  if (box.id === 'remote') f.remote = box.checked;
  else if (box.dataset.facet) {
    const set = new Set(f[box.dataset.facet]);
    if (box.checked) set.add(box.value); else set.delete(box.value);
    f[box.dataset.facet] = [...set];
  } else return;
  limit = PAGE;
  update();
});
$('#q').addEventListener('input', (e) => { f.q = e.target.value; limit = PAGE; update(); });
$('#sort').addEventListener('change', (e) => { f.sort = e.target.value; update(); });
$('#filter-toggle').addEventListener('click', () => document.body.classList.toggle('show-filters'));
$('.scrim').addEventListener('click', () => document.body.classList.remove('show-filters'));

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target instanceof Element && e.target.matches('input, select, textarea')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const actions = {
    ArrowDown: () => move(1), j: () => move(1),
    ArrowUp: () => move(-1), k: () => move(-1),
    s: () => setStatus('saved'),
    b: () => setStatus('applied'),
    x: () => setStatus('hidden'),
    c: sendSelected,
    o: () => { const j = byId.get(selected); const url = j && Object.values(j.links || {})[0]; if (/^https?:\/\//i.test(url || '')) window.open(url, '_blank', 'noopener'); },
    '/': () => $('#q').focus(),
    Escape: () => document.body.classList.remove('show-detail', 'show-filters'),
  };
  if (actions[key]) { e.preventDefault(); actions[key](); }
});

// ---- Neu scrapen: spricht mit dem lokalen Server aus scraper.py ----
const SERVED = location.protocol.startsWith('http');
const NO_SERVER = 'Der Knopf braucht den lokalen Server: im Terminal „python scraper.py“ starten, dann öffnet sich die Seite mit funktionierendem Knopf.';
let watching = false; // läuft gerade ein Lauf, den diese Seite mitverfolgt?

// kind: undefined = Balken läuft, 'done' = fertig, 'note' = nur Hinweistext
function showProgress(percent, text, kind) {
  $('#progress').hidden = false;
  $('#progress').classList.toggle('note', kind === 'note');
  $('#pfill').style.width = `${percent}%`;
  $('#pbar').setAttribute('aria-valuenow', Math.round(percent));
  $('#ptext').textContent = text;
  $('#ppct').textContent = `${Math.round(percent)} %`;
  $('#pdone').hidden = kind !== 'done';
}

async function pollStatus() {
  let st;
  try {
    st = await (await fetch('/api/status', { cache: 'no-store' })).json();
  } catch {
    if (watching) {
      watching = false;
      $('#scrape').disabled = false;
      showProgress(0, 'Verbindung zum Server verloren. Läuft scraper.py noch?', 'note');
    }
    return;
  }
  $('#scrape').disabled = st.running;
  if (st.running) {
    watching = true;
    showProgress(st.percent, st.text);
    setTimeout(pollStatus, 1000);
  } else if (watching) {
    watching = false;
    if (st.error) showProgress(0, `Fehler beim Scrapen: ${st.error}`, 'note');
    else showProgress(100, `Fertig: ${st.new} ${st.new === 1 ? 'neuer Job' : 'neue Jobs'}, ${st.total} insgesamt.`, 'done');
  }
}

$('#scrape').addEventListener('click', async () => {
  if (!SERVED) { showProgress(0, NO_SERVER, 'note'); return; }
  $('#scrape').disabled = true;
  try {
    const res = await fetch('/api/scrape', { method: 'POST' });
    if (!res.ok) throw new Error(res.status);
    watching = true;
    showProgress(0, 'Starte …');
    pollStatus();
  } catch {
    $('#scrape').disabled = false;
    showProgress(0, NO_SERVER, 'note');
  }
});
$('#pdone').addEventListener('click', () => location.reload());
if (SERVED) pollStatus(); // läuft schon ein Lauf (z. B. nach Neuladen), Balken wieder zeigen

// ---- An career-ops senden: der Server legt Stellentext und Inbox-Zeile dort ab ----
function setCareerOps(state) {
  careerOps = { ready: state.ready, sent: new Set(state.sent) };
  renderList();
  renderDetail();
}

async function sendJobs(list) {
  if (!list.length) return;
  if (!SERVED) { showProgress(0, NO_SERVER, 'note'); return; }
  let state;
  try {
    const res = await fetch('/api/career-ops', { method: 'POST', body: JSON.stringify({ jobs: list.map(snapshot) }) });
    if (!res.ok) throw new Error(res.status);
    state = await res.json();
  } catch {
    showProgress(0, 'Senden fehlgeschlagen. Bitte scraper.py neu starten.', 'note');
    return;
  }
  setCareerOps(state);
  if (!state.ready) showProgress(0, 'career-ops wurde nicht gefunden. Der Ordner „career-ops“ muss neben scraper.py liegen.', 'note');
  else if (state.error) showProgress(0, `Senden fehlgeschlagen: ${state.error}`, 'note');
  else showProgress(0, `${state.new.length} ${state.new.length === 1 ? 'Job' : 'Jobs'} an career-ops gesendet. Dort mit „/career-ops pipeline“ bewerten.`, 'note');
}

function sendSelected() {
  const j = byId.get(selected);
  if (j && !careerOps.sent.has(j.id)) sendJobs([j]);
}

async function loadCareerOps() {
  try {
    setCareerOps(await (await fetch('/api/career-ops', { cache: 'no-store' })).json());
  } catch {} // älterer Server ohne diese Route: Knöpfe melden sich beim Klick
}

// ---- Start ----
saveMarks();
$('#sort').value = sorters[f.sort] ? f.sort : 'date';
if (DATA.generated) {
  const stand = new Date(DATA.generated).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const where = (DATA.locations || []).join(', ') + (DATA.radius_km ? ` +${DATA.radius_km} km` : '');
  $('#meta').textContent = `${DATA.jobs.length} Jobs · ${where} · Stand ${stand}`;
}
update();
// nach "Jetzt anzeigen" (Neuladen) beim zuletzt offenen Job weitermachen
let last = null;
try { last = sessionStorage.getItem('jobs-selected'); } catch {}
select(visible.some((j) => j.id === last) ? last : (visible[0] || {}).id, false);
if (SERVED) loadCareerOps();
})();
</script>
